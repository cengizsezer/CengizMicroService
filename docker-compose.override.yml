version: '3.4'

services:

  webapp:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "2000:80"
    networks:
      - net_frontend
      - net_apigateway
    
  web.apigateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5000
    ports:
      - "5000:5000"
    networks:
      - net_apigateway
      - net_backendservices


  identityservice:
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5005
      - ConsulConfig__Address=http://s_consul:8500
      - ConsulConfig__ServiceAddress=http://c_identityservice:5005
      - ConsulConfig__ServiceName=IdentityService
      - ConsulConfig__ServiceId=Identity
    ports:
      - "5005:5005"
    networks:
      - net_backendservices
    depends_on:
      - web.apigateway
      - s_sqlserver
      - s_consul
      - s_rabbitmq
    external_links:
      - c_graylog
      - s_consul
      - s_rabbitmq
      - s_sqlserver

  catalogservice.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5004
      - ConsulConfig__Address=http://s_consul:8500
      - ConsulConfig__ServiceAddress=http://c_catalogservice:5004
      - ConsulConfig__ServiceName=CatalogService
      - ConsulConfig__ServiceId=Catalog
    ports:
      - "5004:5004"
    networks:
      - net_backendservices
    depends_on:
      - web.apigateway
      - s_sqlserver
      - s_consul
      - s_rabbitmq
    external_links:
      - c_graylog
      - s_consul
      - s_rabbitmq
      - s_sqlserver
 
  fileapiservice.api:
    container_name: c_fileapiservice        # ConsulConfig__ServiceAddress ile uyumlu
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5009
      - ConsulConfig__Address=http://s_consul:8500
      - ConsulConfig__ServiceAddress=http://c_fileapiservice:5009
      - ConsulConfig__ServiceName=FileApiService
      - ConsulConfig__ServiceId=FileApi

      - Minio__Endpoint=s_minio:9000       
      - Minio__AccessKey=admin              
      - Minio__SecretKey=admin12345
      - Minio__WithSSL=false              
      - Minio__Bucket=dijitalmasraf
      - MinioPublic__Endpoint=s3.dijitalmasraf.com
    ports:
      - "5009:5009"
    networks:
      - net_backendservices
    depends_on:
      - web.apigateway
      - s_sqlserver
      - s_consul
      - s_rabbitmq
                
     


  ocrservice.api:
    image: ocrservice.api
    build:
      context: .
      dockerfile: Services/OCRService/OCRService.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5002
      - ConsulConfig__Address=http://s_consul:8500
      - ConsulConfig__ServiceAddress=http://c_ocrservice:5002
      - ConsulConfig__ServiceName=OCRService
      - ConsulConfig__ServiceId=OCR
      - OpenAI__ApiKey=${OPENAI_API_KEY}
      - GoogleVision__CredentialsPath=${GOOGLE_APPLICATION_CREDENTIALS}
    ports:
      - "5002:5002"
    networks:
      - net_backendservices
    depends_on:
      - web.apigateway
      - s_sqlserver
      - s_consul
      - s_rabbitmq
    external_links:
      - c_graylog
      - s_consul
      - s_rabbitmq
      - s_sqlserver
    volumes:
      - ./Services/OCRService/OCRService.Api/Config:/app/Services/OCRService/OCRService.Api/Config:ro


  

  catalogseeder.api:
    command: ["dotnet", "CatalogService.Api.dll", "--seed-force"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    networks:
      - net_backendservices
    depends_on:
      - s_sqlserver
    external_links:
      - c_graylog
      - s_consul
      - s_rabbitmq
      - s_sqlserver

  nginx.public:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - net_apigateway
      - net_frontend
      - net_backendservices
    depends_on:
      - webapp
      - web.apigateway     

  s_consul:
    ports:
      - 8500:8500
      - 8600:8600/tcp
      - 8600:8600/udp
    networks:
      - net_apigateway
      - net_frontend
      - net_backendservices

  s_sqlserver:
    user: root
    ports:
      - 1433:1433
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=0-jofnvbsvCS!
    volumes:
      - sqlserver_data:/var/opt/mssql/data
      - sqlserver_log:/var/opt/mssql/log
    networks:
      - net_backendservices

  s_rabbitmq:
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    networks:
      - net_backendservices
      - net_apigateway
      - net_frontend

 

networks:
  net_apigateway:
    driver: bridge
    external: true
  net_frontend:
    driver: bridge
    external: true
  net_backendservices:
    driver: bridge
    external: true

volumes:
  nginx_cache:
  rabbitmq:
  sqlserver_data:
  sqlserver_log:
