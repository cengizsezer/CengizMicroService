# WebSocket el sıkışması: Connection başlığı "upgrade" olmalı; upgrade isteği
# değilse bağlantı normal şekilde kapansın.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name dijitalmasraf.com www.dijitalmasraf.com;

    ssl_certificate /etc/letsencrypt/live/dijitalmasraf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dijitalmasraf.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, TenantNo" always;
            return 204;
        }

        proxy_pass http://web.apigateway:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

   location /api/file/ {
    client_max_body_size 20m;
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    proxy_pass http://web.apigateway:5000/file/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
   }
    # 🔁 API Gateway yönlendirmeleri (Ocelot)
    location /catalog/ {
        proxy_pass http://web.apigateway:5000/catalog/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR agent hub — gateway'i atlar, doğrudan CatalogService'e gider.
    # WebSocket uzun ömürlü bağlantı; Ocelot'un timeout/buffering ayarlarıyla
    # iyi geçinmiyor (KARARLAR.md §100-103).
    location /agenthub {
        # URI'siz proxy_pass: /agenthub ve /agenthub/negotiate sorgu dizesiyle
        # birlikte aynen aktarılır. Yol eklenirse SignalR el sıkışması bozulur.
        # Konteyner adı değişkene alındı: nginx çözümlemeyi istek anına erteler,
        # böylece CatalogService nginx'ten sonra ayağa kalksa bile nginx başlar.
        resolver 127.0.0.11 valid=10s ipv6=off;   # Docker'ın gömülü DNS'i
        set $agenthub_upstream http://catalogservice.api:5004;
        proxy_pass $agenthub_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /auth/ {
        proxy_pass http://web.apigateway:5000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /faturakontrol/ {
        proxy_pass http://web.apigateway:5000/faturakontrol/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ocr/ {
        client_max_body_size 20m;
        proxy_request_buffering off;
        proxy_buffering off;

        # CORS preflight (RadzenUpload için önemli)
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "*";
            return 204;
        }

        proxy_pass http://web.apigateway:5000/ocr/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ♻️ Geri uyumluluk: /api/ocr/* geldi ise /ocr/*'a yönlendir
    location ~* ^/api/ocr/(.*)$ {
        return 301 /ocr/$1;
    }

    # 🎯 Blazor WebAssembly frontend (statik dosyalar)
    location / {
        proxy_pass http://webapp:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 🛡️ HTTP → HTTPS yönlendirmesi
server {
    listen 80;
    server_name dijitalmasraf.com www.dijitalmasraf.com;

    return 301 https://$host$request_uri;
}
