server {
    listen 443 ssl;
    server_name dijitalmasraf.com www.dijitalmasraf.com;

    ssl_certificate /etc/letsencrypt/live/dijitalmasraf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dijitalmasraf.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 🔁 API Gateway yönlendirmeleri (Ocelot)
    location /catalog/ {
        proxy_pass http://web.apigateway:5000/catalog/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://web.apigateway:5000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /OCR/ {
        proxy_pass http://web.apigateway:5000/OCR/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 🎯 Blazor WebAssembly frontend (statik dosyalar)
    location / {
        proxy_pass http://webapp:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 🛡️ HTTP → HTTPS yönlendirmesi
server {
    listen 80;
    server_name dijitalmasraf.com www.dijitalmasraf.com;

    return 301 https://$host$request_uri;
}