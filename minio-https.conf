# 80 -> 443 (sadece alt alanlar)
server {
    listen 80;
    server_name s3.dijitalmasraf.com minio.dijitalmasraf.com;
    return 301 https://$host$request_uri;
}

# 443: S3 API -> s_minio:9000
server {
    listen 443 ssl;
    http2 on;
    server_name s3.dijitalmasraf.com;

    ssl_certificate     /etc/letsencrypt/live/s3.dijitalmasraf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3.dijitalmasraf.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s; proxy_send_timeout 600s; proxy_connect_timeout 60s;

    location / {
        proxy_pass http://s_minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        chunked_transfer_encoding on;
    }
}

# 443: MinIO Console -> s_minio:9001
server {
    listen 443 ssl;
    http2 on;
    server_name minio.dijitalmasraf.com;

    ssl_certificate     /etc/letsencrypt/live/s3.dijitalmasraf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3.dijitalmasraf.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;

    location / {
        proxy_pass http://s_minio:9001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
