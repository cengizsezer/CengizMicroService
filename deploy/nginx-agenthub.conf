# =============================================================================
#  PkfRobot ajan hub'ı — nginx yapılandırması
# =============================================================================
#
#  Hedef:  wss://dijitalmasraf.com/agenthub  ->  nginx  ->  c_catalogservice:5004
#
#  NEDEN OCELOT'TAN GEÇMİYOR
#  Hub uzun ömürlü bir WebSocket bağlantısı. Ocelot bunu HTTP isteği gibi görüp
#  kendi timeout ve buffering ayarlarını uyguluyor; bu projede uzun süren batch
#  rotalarında aynı sorun zaten yaşandı. Bu yüzden nginx /agenthub yolunu
#  doğrudan CatalogService container'ına bağlıyor. Durum ucu
#  (/catalog/agent/baglilar) sıradan bir HTTP isteği olduğu için Ocelot'tan
#  geçmeye devam ediyor — ocelot.json'a dokunulmadı.
#
#  DİKKAT: Aşağıdaki iki parça iki AYRI dosyaya gidiyor. Bir tanesini iki kez
#  eklemeyin; nginx aynı server bloğunda tekrar eden location'ı
#  "duplicate location" hatasıyla reddeder ve o an ayağa kalkmaz.
#
# -----------------------------------------------------------------------------
#  PARÇA 1 — http bloğuna  (Nginx/nginx.conf, "include /etc/nginx/conf.d/*.conf"
#            satırının ÜSTÜNE; map yalnız http bağlamında yazılabilir)
# -----------------------------------------------------------------------------

    # WebSocket el sıkışmasında Connection başlığı "upgrade" olmalı; upgrade
    # isteği değilse bağlantı normal şekilde kapansın. $http_upgrade'i doğrudan
    # geçirmek yanlış olurdu ("Connection: websocket" diye bir şey yok).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

# -----------------------------------------------------------------------------
#  PARÇA 2 — 443 server bloğunun İÇİNE
#            (Nginx/conf.d/dijitalmasraf.conf, "location / { ... }" bloğunun
#             ÜSTÜNE — nginx en uzun ön eki seçtiği için sıra aslında önemsiz,
#             ama okurken kaybolmasın)
# -----------------------------------------------------------------------------

    location /agenthub {
        # URI'siz proxy_pass: /agenthub ve /agenthub/negotiate aynen aktarılır,
        # sorgu dizesiyle birlikte (SignalR token'ı ?access_token= ile taşır).
        proxy_pass http://c_catalogservice:5004;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bağlantı gün boyu açık kalacak. Varsayılan 60 sn'lik okuma zaman aşımı,
        # ajan sessizce beklerken bağlantıyı koparır; ajan yeniden bağlanır ama
        # her dakika bir kopuş/kayıt turu döner.
        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        # WebSocket'te tamponlama yok: iş emri ajanda gecikmeden görünsün.
        proxy_buffering off;
        proxy_cache off;
    }

# =============================================================================
#  NASIL UYGULANIR
#  Ayrıntılı adımlar ve doğrulama komutları: OZET.md > "Nginx: /agenthub yolu"
# =============================================================================
